name: Webtoon Build

on:
  push:
    branches:
      - feature/webtoon-continuous-scroll
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fix SevenZipSharp CI constants
        shell: pwsh
        run: |
          $path = 'SevenZipSharp/SevenZip/SevenZip.csproj'
          $text = Get-Content $path -Raw
          $text = $text.Replace("'`$(Configuration)|`$(Platform)'=='Release|AnyCPU'", "'`$(Configuration)'=='Release'")
          $text = $text.Replace("'`$(Configuration)|`$(Platform)'=='Debug|AnyCPU'", "'`$(Configuration)'=='Debug'")
          Set-Content $path $text -Encoding utf8

      - name: Restore
        run: dotnet restore NeeView.sln -p:Configuration=Release -p:Platform=x64

      - name: Build NeeView
        run: dotnet build NeeView/NeeView.csproj -c Release -p:Platform=x64 --no-restore

      - name: Run unit tests
        run: dotnet test NeeView.UnitTest/NeeView.UnitTest.csproj -c Release -p:Platform=x64 --no-restore --verbosity normal

      - name: Publish portable test build
        run: dotnet publish NeeView/NeeView.csproj -c Release -p:Platform=x64 --no-restore -o artifacts/NeeView-Webtoon

      - name: Upload NeeView-Webtoon artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeeView-Webtoon-test
          path: artifacts/NeeView-Webtoon
          if-no-files-found: error
