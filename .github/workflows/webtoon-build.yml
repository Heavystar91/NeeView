name: Webtoon Build

on:
  push:
    branches:
      - feature/webtoon-continuous-scroll
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NeeView.sln

      - name: Build NeeView
        run: dotnet build NeeView/NeeView.csproj -c Release -p:Platform=x64 --no-restore

      - name: Run unit tests
        run: dotnet test NeeView.UnitTest/NeeView.UnitTest.csproj -c Release --no-restore --verbosity normal
